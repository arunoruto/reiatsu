name: Docker

# main -> :edge. A published GitHub release vX.Y.Z -> :X.Y.Z, :X.Y, :latest
# (the HA add-on pulls :<version>).
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag matches the package and add-on versions
        if: github.event_name == 'release'
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          a=$(sed -n 's/^version: "\(.*\)"/\1/p' addon/config.yaml)
          echo "tag ${GITHUB_REF_NAME}, package $v, add-on $a"
          test "${GITHUB_REF_NAME}" = "v$v" && test "$a" = "$v"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          # linux/arm/v7 left out: no numpy/scipy wheels, building them under QEMU takes hours
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reiatsu"
version = "0.4.3"
description = "Wall-aware BLE room locator for phones in a home"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "paho-mqtt>=2"]

[project.scripts]
reiatsu = "reiatsu.daemon:main"

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx==9.1.0", "shibuya==2026.7.12", "myst-parser==5.1.0", "sphinx-copybutton==0.5.2", "sphinxcontrib-mermaid==2.1.1", "sphinxcontrib-bibtex==2.7.0"]

[tool.setuptools]
packages = ["reiatsu"]

[tool.setuptools.package-data]
reiatsu = ["web/*.html", "web/vendor/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

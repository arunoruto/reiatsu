[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reiatsu"
version = "0.2.0"
description = "Wall-aware BLE room locator for phones in a home"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "paho-mqtt>=2"]

[project.scripts]
reiatsu = "reiatsu.daemon:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["reiatsu"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

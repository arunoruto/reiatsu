# The real flat, as far as it is known. Single floor, metres, x right, y down
# (image convention, so a scanned floor plan overlays directly in the web UI).
# Rooms are polygons or [x0, y0, x1, y1] rectangles. Walls are derived: parallel
# edges of two rooms closer than max_gap become one interior wall on their
# midline; all other edges are exterior walls.
max_gap: 0.4

rooms:
  Bathroom: [0, 0, 1.57, 3.27]
  Kitchen: [1.7, 0, 3.85, 3.26]
  Work: [3.98, 0, 6.89, 3.45]
  Hallway: [[0, 3.38], [0, 4.6], [6.9, 4.6], [6.9, 3.56], [3.74, 3.56], [3.74, 3.38]]
  Bedroom: [7.02, 0, 10.57, 4.62]
  Living Room: [5.57, 4.94, 10.57, 9.65]

materials:          # defaults for derived walls
  interior: drywall
  exterior: brick

walls:              # material overrides: two rooms = their shared wall, one room = its exterior walls
  - rooms: [Bathroom, Kitchen]
    material: brick       # guess
  - rooms: [Bedroom, Living Room]
    material: concrete    # guess

# Interior door positions are guesses: every room opens to the hallway.
# A door with one room is a door to the outside.
doors:
  - {rooms: [Hallway], at: [0, 4.0], width: 0.9}           # entrance, left end of the hallway
  - {rooms: [Hallway, Bathroom], at: [0.8, 3.33], width: 0.7}
  - {rooms: [Hallway, Kitchen], at: [2.8, 3.32], width: 0.8}
  - {rooms: [Hallway, Work], at: [5.0, 3.5], width: 0.8}
  - {rooms: [Hallway, Bedroom], at: [6.96, 4.1], width: 0.8}
  - {rooms: [Hallway, Living Room], at: [6.3, 4.77], width: 0.9}

# Receiver ids are the bridge's: ha_usb, lego_space_age, lego_milkyway. Their
# positions are not known yet: place them in the web UI. Fields: id, x, y,
# z (default 1.0), optional room (default: the room at x, y) and p0 (dBm at 1 m,
# overrides the prior, e.g. for an adapter inside a cabinet).
# The Stromleser (ESP32-C3 meter reader, hallway wall opposite the bathroom door,
# about (0.8, 4.6)) sits inside a metal breaker box: not used as a receiver.
receivers: []

# Stationary tracked devices at known spots: ground truth for the live error
# and, later, calibration labels.
references:
  - {device: nuki, x: 0.1, y: 4.0}    # Nuki lock on the entrance door
